<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Triage · AI Support</title>
    <style>
        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #0b1120 0%, #1a2332 100%);
            padding: 1.5rem;
        }

        /* ---------- Card Container ---------- */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2.5rem;
            padding: 3rem 2.5rem;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        /* ---------- Header ---------- */
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2.25rem;
        }

        .logo {
            width: 2.8rem;
            height: 2.8rem;
            background: linear-gradient(135deg, #4f8cff, #7c3aed);
            border-radius: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 8px 20px -8px rgba(79, 140, 255, 0.4);
        }

        .header h1 {
            color: #f1f5f9;
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .header span {
            color: #8b9bb5;
            font-weight: 400;
            font-size: 1rem;
            margin-left: 0.2rem;
        }

        /* ---------- Input Section ---------- */
        label {
            display: block;
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.6rem;
            letter-spacing: 0.3px;
        }

        textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.2rem;
            color: #f1f5f9;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            min-height: 120px;
            transition: border 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        textarea:focus {
            border-color: #4f8cff;
            box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.15);
        }

        textarea::placeholder {
            color: #4a5a74;
            font-weight: 400;
        }

        /* ---------- Button ---------- */
        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        button {
            background: linear-gradient(135deg, #4f8cff, #7c3aed);
            border: none;
            padding: 0.9rem 2.6rem;
            border-radius: 3rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px -6px rgba(79, 140, 255, 0.3);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 32px -6px rgba(79, 140, 255, 0.5);
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ---------- Result Section ---------- */
        .result-area {
            margin-top: 2.5rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .result-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1.2rem;
            padding: 1.5rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .result-left {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a7f9e;
            font-weight: 600;
        }

        .result-priority {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            transition: color 0.3s ease;
        }

        .result-priority.high {
            color: #fb7185;
        }
        .result-priority.low {
            color: #34d399;
        }
        .result-priority.idle {
            color: #4a5a74;
        }

        .result-score {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #8b9bb5;
            font-variant-numeric: tabular-nums;
        }

        .status-message {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #5a6f8e;
            text-align: center;
            min-height: 1.5rem;
        }

        .status-message.success {
            color: #34d399;
        }
        .status-message.error {
            color: #fb7185;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 500px) {
            .card {
                padding: 1.8rem 1.2rem;
                border-radius: 1.8rem;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .result-priority {
                font-size: 1.4rem;
            }
            button {
                width: 100%;
                justify-content: center;
            }
            .action-row {
                justify-content: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Header -->
        <div class="header">
            <div class="logo">⚡</div>
            <h1>Triage<span>AI</span></h1>
        </div>

        <!-- Input -->
        <label for="ticketText">📝 Customer Ticket</label>
        <textarea id="ticketText" placeholder="Paste the support message here... e.g. 'URGENT! My payment failed twice!'"></textarea>

        <!-- Action -->
        <div class="action-row">
            <button id="submitBtn">
                <span>🚀</span> Classify Priority
            </button>
        </div>

        <!-- Result -->
        <div class="result-area">
            <div class="result-card" id="resultCard">
                <div class="result-left">
                    <span class="result-label">Predicted Priority</span>
                    <span class="result-priority idle" id="priorityDisplay">—</span>
                </div>
                <div class="result-score" id="scoreDisplay">Score: —</div>
            </div>
            <div class="status-message" id="statusMsg">Waiting for your first ticket...</div>
        </div>

    </div>

    <script>
        // --- DOM refs ---
        const textarea = document.getElementById('ticketText');
        const submitBtn = document.getElementById('submitBtn');
        const priorityDisplay = document.getElementById('priorityDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const statusMsg = document.getElementById('statusMsg');

        // --- Helper: reset styles ---
        function setPriority(priority, score) {
            // Remove all priority classes
            priorityDisplay.classList.remove('high', 'low', 'idle');

            if (priority === 'HIGH') {
                priorityDisplay.textContent = '🔴 HIGH';
                priorityDisplay.classList.add('high');
            } else if (priority === 'LOW') {
                priorityDisplay.textContent = '🟢 LOW';
                priorityDisplay.classList.add('low');
            } else {
                priorityDisplay.textContent = '—';
                priorityDisplay.classList.add('idle');
            }

            scoreDisplay.textContent = `Score: ${score !== undefined ? score.toFixed(4) : '—'}`;
        }

        // --- Main function ---
        async function classifyTicket() {
            const text = textarea.value.trim();

            if (!text) {
                statusMsg.textContent = '⚠️ Please paste a ticket message first.';
                statusMsg.className = 'status-message error';
                return;
            }

            // UI: loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>⏳</span> Analyzing...';
            statusMsg.textContent = '⏳ Running inference...';
            statusMsg.className = 'status-message';

            try {
                const response = await fetch('/api/triage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Server error (${response.status}): ${errText}`);
                }

                const data = await response.json();

                // data = { score: 1.0, priority: "HIGH", message: "..." }
                setPriority(data.priority, data.score);

                statusMsg.textContent = `✅ ${data.message || 'Ticket logged successfully'}`;
                statusMsg.className = 'status-message success';

            } catch (error) {
                console.error('Error:', error);
                statusMsg.textContent = `❌ ${error.message || 'Failed to reach the AI service.'}`;
                statusMsg.className = 'status-message error';
                setPriority(null, null); // reset to idle
            } finally {
                // UI: restore button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>🚀</span> Classify Priority';
            }
        }

        // --- Event listeners ---
        submitBtn.addEventListener('click', classifyTicket);

        // Press Ctrl+Enter or Cmd+Enter to submit
        textarea.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                classifyTicket();
            }
        });

        // --- Pre-fill with a demo example for instant testing ---
        // (Optional: comment out if you want a blank start)
        textarea.value = "URGENT! System is completely down, fix it ASAP!!!";
        // Auto-classify on load so they see it working instantly
        window.addEventListener('DOMContentLoaded', () => {
            // Small delay so the UI paints first
            setTimeout(classifyTicket, 300);
        });
    </script>

</body>
</html>
