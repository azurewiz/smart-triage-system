name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'
      
      - name: Make mvnw executable
        run: chmod +x backend/mvnw
      
      - name: Build Spring Boot app (compile only)
        run: |
          cd backend
          ./mvnw clean compile -DskipTests

  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Python dependencies
        run: |
          cd ml-model
          pip install scikit-learn pandas skl2onnx pytest
      
      - name: Run Python training script (smoke test)
        run: |
          cd ml-model
          python3 train_model.py
      
      - name: Run Python feature extraction tests
        run: |
          cd ml-model
          pytest test_features.py