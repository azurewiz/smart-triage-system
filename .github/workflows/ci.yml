name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build Spring Boot app
        run: |
          cd backend
          ./mvnw clean package -DskipTests
      - name: Run Java Unit Tests
        run: |
          cd backend
          ./mvnw test

  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          cd ml-model
          pip install scikit-learn pandas skl2onnx
      - name: Run Python training script (smoke test)
        run: |
          cd ml-model
          python train_model.py
      - name: Run Python feature extraction tests
        run: |
          cd ml-model
          pytest test_features.py -v